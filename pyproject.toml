[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-nari"
version = "0.1.0"
description = "Nari Labs streaming speech integration for LiveKit Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "shamuiscoding", email = "toebee@snu.ac.kr" }]
dependencies = ["livekit-agents>=1.8.2,<1.9", "aiohttp>=3.10,<4", "websockets>=15,<18"]

[project.urls]
Documentation = "https://docs.narilabs.com"
Repository = "https://github.com/nari-labs/livekit-plugins-nari"

[project.optional-dependencies]
examples = ["livekit-plugins-openai>=1.8.2,<1.9", "livekit-plugins-silero>=1.8.2,<1.9", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
